<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forms</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <form action="" id="myform">
    <main class="form" id="main" name = "student">
        <h1>Regestration Form</h1>
        <div class="main">
        <div class="left">
    <div>
        <label for="user">User Name</label>
        <input type="text" placeholder="Enter your name" id="user" name="Username">
    </div>
    <div>
        <label for="email">Email</label>
        <input type="text" placeholder="Enter your Email" id="email" name="email">
    </div>
    <div>
        <label for="password">Password</label>
        <input type="number" placeholder="Enter your password" id="password"  name="password">
    </div>
</div>
<div class="right">
    <div>
        <label for="lastname">Another name</label>
        <input type="text" placeholder="Enter the other name" id="lastname" name="lastname">
    </div>
    <div>
        <label for="contact">Phone Number</label>
        <input type="number" placeholder="Enter your phone number" id="contact" name="contact">
    </div>
    <div>
        <label for="conformpassword">Conform Password</label>
        <input type="text" placeholder="Conform Password" id="conformpassword" name="conformpassword">
    </div>
</div>
</div>
<div>
<h2>Gender</h2>
<div class="radio">
<label for="male">Male</label>
<input type="radio" name="gender" value="male" id="male">
<label for="female">Female</label>
<input type="radio" name="gender" value="female" id="female">
<label for="other">Other</label>
<input type="radio" name="gender" id="other" value="Shemale">
</div>

    </form>
